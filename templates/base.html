<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}VPS Hosting{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='css/style.css') }}" rel="stylesheet"></head><body><div class="d-flex"><aside class="sidebar p-3"><a class="brand" href="{{ url_for('dashboard.index') }}">VPS<span>Control</span></a><small class="text-uppercase text-secondary d-block mt-4 mb-2">Management</small><nav class="nav flex-column gap-1"><a href="{{ url_for('dashboard.index') }}">Dashboard</a><a href="{{ url_for('users.index') }}">Users</a><a href="{{ url_for('vps.index') }}">VPS Servers</a><a href="{{ url_for('domains.index') }}">Domains</a><a href="{{ url_for('invoices.index') }}">Invoices</a><a href="{{ url_for('tickets.index') }}">Tickets</a><a href="{{ url_for('reports.index') }}">Reports</a></nav><a class="logout" href="{{ url_for('auth.logout') }}">Log out</a></aside><main class="content flex-grow-1"><header class="topbar"><button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle">Menu</button><span>Welcome, {{ session.user_name }}</span></header><div class="container-fluid p-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
