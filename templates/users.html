{% extends 'base.html' %}{% block content %}<h1>Users</h1><div class="row g-4"><div class="col-lg-4"><div class="card"><div class="card-body"><h5>{{'Edit user' if edit_user else 'Add user'}}</h5><form method="post" action="{{url_for('users.edit',user_id=edit_user.UserID) if edit_user else url_for('users.index')}}"><input class="form-control mb-2" name="full_name" placeholder="Full name" value="{{edit_user.FullName if edit_user else ''}}" required><input class="form-control mb-2" name="email" type="email" placeholder="Email" value="{{edit_user.Email if edit_user else ''}}" required><input class="form-control mb-2" name="phone" placeholder="Phone" value="{{edit_user.Phone if edit_user else ''}}"><input class="form-control mb-3" name="password" type="password" placeholder="{{'New password (optional)' if edit_user else 'Password'}}" {{'required' if not edit_user else ''}}><button class="btn btn-primary">Save user</button>{% if edit_user %}<a class="btn btn-light" href="{{url_for('users.index')}}">Cancel</a>{% endif %}</form></div></div></div><div class="col-lg-8"><form class="input-group mb-3"><input class="form-control" name="email" value="{{search}}" placeholder="Search by email"><button class="btn btn-outline-secondary">Search</button></form><div class="card table-card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.FullName}}</td><td>{{u.Email}}</td><td>{{u.Phone}}</td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" href="{{url_for('users.edit',user_id=u.UserID)}}">Edit</a><form class="d-inline" method="post" action="{{url_for('users.delete',user_id=u.UserID)}}"><button class="btn btn-sm btn-outline-danger" data-confirm="Delete this user?">Delete</button></form></td></tr>{% else %}<tr><td colspan="4" class="text-center text-muted">No users found.</td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
