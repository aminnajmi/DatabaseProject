<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='css/style.css') }}" rel="stylesheet"></head><body class="login-page"><main class="login-card"><h1>VPS<span>Control</span></h1><p class="text-muted mb-4">Administrator sign in</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required autofocus><label class="form-label">Password</label><input class="form-control mb-4" name="password" type="password" required><button class="btn btn-primary w-100">Sign in</button></form><p class="small text-muted mt-4 mb-0">Default: admin@vpshosting.local / Admin@123</p></main></body></html>
