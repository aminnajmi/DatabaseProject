{% extends 'base.html' %}{% block content %}<h1>Invoices</h1><div class="card mb-4"><div class="card-body"><h5>Create invoice</h5><form method="post" class="row g-2"><div class="col-md-3"><select class="form-select" name="user_id">{% for u in users %}<option value="{{u.UserID}}">{{u.FullName}}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" type="number" step="0.01" name="amount" placeholder="Amount" required></div><div class="col-md-2"><input class="form-control" type="date" name="issue_date" required></div><div class="col-md-2"><input class="form-control" type="date" name="due_date" required></div><div class="col-md-2"><select class="form-select" name="status"><option>Unpaid</option><option>Paid</option><option>Overdue</option></select></div><div class="col-md-1"><button class="btn btn-primary">Create</button></div></form></div></div><div class="card table-card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>#</th><th>Customer</th><th>Amount</th><th>Paid</th><th>Dates</th><th>Status</th></tr></thead><tbody>{% for i in invoices %}<tr><td>{{i.InvoiceID}}</td><td>{{i.FullName}}</td><td>{{i.Amount}}</td><td>{{i.PaidAmount}}</td><td><small>Issued: {{i.IssueDate}}<br>Due: {{i.DueDate}}</small></td><td>{{i.Status}}</td></tr>{% else %}<tr><td colspan="6" class="text-center text-muted">No invoices found.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
