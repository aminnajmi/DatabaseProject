{% extends 'base.html' %}{% block content %}<h1>Support Tickets</h1><div class="card mb-4"><div class="card-body"><h5>Create ticket</h5><form method="post" class="row g-2"><div class="col-md-3"><select class="form-select" name="user_id">{% for u in users %}<option value="{{u.UserID}}">{{u.FullName}}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" name="subject" placeholder="Subject" required></div><div class="col-md-4"><input class="form-control" name="message" placeholder="Message" required></div><div class="col-md-1"><select class="form-select" name="status"><option>Open</option><option>In Progress</option><option>Closed</option></select></div><div class="col-md-1"><button class="btn btn-primary">Create</button></div></form></div></div><div class="card table-card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>#</th><th>Customer</th><th>Subject</th><th>Message</th><th>Created</th><th>Status</th></tr></thead><tbody>{% for t in tickets %}<tr><td>{{t.TicketID}}</td><td>{{t.FullName}}</td><td>{{t.Subject}}</td><td>{{t.Message}}</td><td>{{t.CreatedAt}}</td><td><form method="post" action="{{url_for('tickets.status',ticket_id=t.TicketID)}}"><select class="form-select form-select-sm" name="status" onchange="this.form.submit()">{% for x in ['Open','In Progress','Closed'] %}<option {{'selected' if t.Status==x else ''}}>{{x}}</option>{% endfor %}</select></form></td></tr>{% else %}<tr><td colspan="6" class="text-center text-muted">No tickets found.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
